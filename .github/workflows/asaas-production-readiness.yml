name: Asaas Production - fail-closed preparation
on:
  pull_request:
    paths:
      - "supabase/functions/_shared/asaas-production/**"
      - "supabase/functions/asaas-production-*/**"
      - "docs/asaas-production/**"
      - "src/lib/asaas-production-guard.test.ts"
      - "src/lib/asaas-production-pilot*"
      - "src/pages/ProductionSubscription.tsx"
      - "src/App.tsx"
      - ".github/workflows/asaas-production-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-local-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Server-side environment isolation tests
        run: npx vitest run src/lib/asaas-production-guard.test.ts src/lib/asaas-production-pilot.test.ts --maxWorkers=2
      - name: Ensure production SQL remains a reviewed draft
        shell: bash
        run: |
          if grep -rl 'asaas_prod_' supabase/migrations/; then
            echo "Unexpected automatic production migration"; exit 1
          fi
          test -f docs/asaas-production/review-only/01_SCHEMA_REVIEW_ONLY.sql
          test -f docs/asaas-production/review-only/02_BILLING_TYPE_REVIEW_ONLY.sql
      - name: TypeScript and current frontend build
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npm run build
