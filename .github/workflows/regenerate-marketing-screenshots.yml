name: Regenerate marketing demo screenshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-landing-demo.mjs'
      - 'scripts/prepare-landing-benefit-assets.mjs'
      - '.github/workflows/regenerate-marketing-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketing-demo-screenshots
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Render all screenshots and full-resolution crops
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/capture-landing-demo.mjs > "$RUNNER_TEMP/marketing-capture.log" 2>&1
          capture_code=$?
          if [ "$capture_code" -eq 0 ]; then
            node scripts/prepare-landing-benefit-assets.mjs >> "$RUNNER_TEMP/marketing-capture.log" 2>&1
            capture_code=$?
          fi
          if [ "$capture_code" -eq 0 ]; then
            node --input-type=module <<'CHECK' >> "$RUNNER_TEMP/marketing-capture.log" 2>&1
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('scripts/landing-demo/manifest.json', 'utf8'));
          const expected = {
            'dashboard.webp': [2880,2640],
            'analises.webp': [2880,3700],
            'registros.webp': [null,null],
            'contas.webp': [2880,1460],
            'extratos.webp': [2880,3200],
            'previsoes.webp': [2880,2200],
          };
          for (const [name,[w,h]] of Object.entries(expected)) {
            const asset=manifest.assets.find(a=>a.name===name);
            if (!asset || (w !== null && asset.width!==w) || (h !== null && asset.height!==h) || (name==='registros.webp' && (asset.width < 2800 || asset.width > 3560 || asset.height < 1300 || asset.height > 2600))) throw Error('Unexpected resolution '+name+': '+JSON.stringify(asset));
          }
          if ((manifest.runtimeErrors || []).length || (manifest.backendRequests || []).length) throw Error('Capture had runtime/backend errors');
          CHECK
            capture_code=$?
          fi
          echo "capture_code=$capture_code" >> "$GITHUB_OUTPUT"
          echo "Capture process exit code: $capture_code"
          tail -70 "$RUNNER_TEMP/marketing-capture.log"
          exit "$capture_code"
      - name: Save generated images OR diagnostic log in GitHub
        if: always() && steps.capture.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.capture.outputs.capture_code }}" = "0" ]; then
            git add public/landing/ scripts/landing-demo/manifest.json
            message="regenerate high resolution marketing DEMO screenshots"
          else
            mkdir -p docs/reviews
            cp "$RUNNER_TEMP/marketing-capture.log" docs/reviews/marketing-capture-last-error.log
            git add -f docs/reviews/marketing-capture-last-error.log
            message="record marketing screenshot regeneration error"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
            generated_commit=$(git rev-parse HEAD)
            # Binary WebP assets cannot be rebased across concurrent capture runs.
            # Reapply exactly the generated files on top of the latest main instead.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              if [ "${{ steps.capture.outputs.capture_code }}" = "0" ]; then
                git restore --source="$generated_commit" --staged --worktree public/landing/ scripts/landing-demo/manifest.json
              else
                git restore --source="$generated_commit" --staged --worktree docs/reviews/marketing-capture-last-error.log
              fi
              if git diff --cached --quiet; then break; fi
              git commit -m "$message"
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
      - name: Fail on capture issues
        if: steps.capture.outputs.capture_code != '0'
        run: exit 1
