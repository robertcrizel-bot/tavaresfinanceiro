name: Build larger FinanceControl icon v2
on:
  push:
    branches: [fix/large-pwa-mark-v2-20261028]
permissions:
  contents: write
jobs:
  icons:
    if: "!contains(github.event.head_commit.message, '[generated-icon-v2]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/enlarge-app-icon-v2.py
      - name: Commit PNG and ICO images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png public/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "style(icon): enlarge PWA and favicon mark [generated-icon-v2]"
            git push
          fi
