name: Refresh FinanceControl app icon assets
on:
  push:
    branches:
      - fix/larger-financecontrol-app-icon-20261028
permissions:
  contents: write
jobs:
  regenerate-icons:
    if: "!contains(github.event.head_commit.message, '[icon-generated]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Enlarge current icon and generate PWA/favicon assets
        run: python scripts/enlarge-app-icon.py
      - name: Commit generated images only to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png public/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "style(icons): enlarge existing logo in PNG and ICO [icon-generated]"
            git push
          fi
