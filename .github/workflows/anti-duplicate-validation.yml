name: Anti-duplicate FinanceControl validation
on:
  push:
    branches: [fix/anti-duplicate-forecasts-categories-20261022]
permissions:
  contents: read
jobs:
  frontend-and-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: guard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-local-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Unit and interface regressions
        run: npm test -- --maxWorkers=2
      - name: TypeScript and production build
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npm run build
      - name: Duplicate guards, legacy rows and concurrent writes in disposable PostgreSQL
        run: |
          psql -h 127.0.0.1 -U postgres -d guard_test -v ON_ERROR_STOP=1 -f supabase/tests/duplicate-guards.sql
          bash supabase/tests/duplicate-guards-concurrency.sh
