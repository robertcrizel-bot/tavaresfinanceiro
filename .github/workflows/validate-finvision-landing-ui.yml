name: Validate FinVision landing and buttons

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/Conhecer.tsx'
      - 'src/pages/Admin.tsx'
      - 'src/lib/beta-admin.ts'
      - 'src/lib/beta-notifications.ts'
      - 'public/sw.js'
      - 'supabase/functions/beta-notify/**'
      - 'supabase/migrations/20261104150000_beta_admin_notifications.sql'
      - 'src/components/AppSidebar.tsx'
      - 'src/App.tsx'
      - 'supabase/functions/beta-admin/**'
      - 'src/pages/Auth.tsx'
      - 'src/pages/Auth.google.test.tsx'
      - 'src/contexts/AuthContext.tsx'
      - 'src/pages/Conhecer.css'
      - 'scripts/qa-finvision-landing.mjs'
      - 'src/pages/Conhecer.test.tsx'
      - 'src/components/ui/button.tsx'
      - 'src/pages/Dashboard.tsx'
      - 'src/pages/Records.tsx'
      - 'public/landing/**'
      - 'scripts/landing-demo/manifest.json'
      - '.github/workflows/validate-finvision-landing-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused lint
        run: npx eslint src/pages/Admin.tsx src/lib/beta-admin.ts src/lib/beta-notifications.ts src/components/AppSidebar.tsx src/App.tsx src/pages/Conhecer.tsx src/pages/Conhecer.test.tsx src/pages/Auth.tsx src/pages/Auth.google.test.tsx src/contexts/AuthContext.tsx src/pages/Dashboard.tsx src/pages/Records.tsx src/components/ui/button.tsx
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Landing tests
        run: npx vitest run src/pages/Conhecer.test.tsx src/pages/Auth.google.test.tsx --maxWorkers=2
      - name: Production build
        run: npm run build
      - name: Install Chromium for visual checks
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile landing layouts
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 5187 --strictPort >/tmp/finvision-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5187/conhecer >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-finvision-landing.mjs http://127.0.0.1:5187 /tmp/finvision-visual-review --benefits

