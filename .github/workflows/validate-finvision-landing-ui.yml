name: Validate FinVision landing and buttons

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/Conhecer.tsx'
      - 'src/pages/Conhecer.css'
      - 'src/pages/Conhecer.test.tsx'
      - 'src/components/ui/button.tsx'
      - 'src/pages/Dashboard.tsx'
      - 'src/pages/Records.tsx'
      - '.github/workflows/validate-finvision-landing-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Focused lint
        run: npx eslint src/pages/Conhecer.tsx src/pages/Conhecer.test.tsx src/pages/Dashboard.tsx src/pages/Records.tsx src/components/ui/button.tsx
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Landing tests
        run: npx vitest run src/pages/Conhecer.test.tsx --maxWorkers=2
      - name: Production build
        run: npm run build
