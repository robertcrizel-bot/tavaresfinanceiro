name: Commercial readiness foundation
on:
  push:
    branches: [product/commercial-readiness-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_commercial
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_commercial"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only-password
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-local-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tests and regressions
        run: npm test -- --maxWorkers=2
      - name: TypeScript and build
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npm run build
      - name: Invoice function privileges (disposable database)
        run: psql -h 127.0.0.1 -U postgres -d test_commercial -v ON_ERROR_STOP=1 -f supabase/tests/commercial-invoice-grants.sql
      - name: Account and card owner isolation (disposable database)
        run: psql -h 127.0.0.1 -U postgres -d test_commercial -v ON_ERROR_STOP=1 -f supabase/tests/account-card-identification-rls.sql
      - name: Generate versioned icons in feature branch only
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/large-pwa-mark-v2-20261028'
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/enlarge-app-icon-v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192-v2.png public/icon-512-v2.png public/favicon-v2.ico
          if ! git diff --cached --quiet; then
            git commit -m "style(icon): enlarged PWA image assets generated"
            git push origin HEAD:fix/large-pwa-mark-v2-20261028
          fi
