name: Asaas Pilot Route - isolated frontend verification
on:
  pull_request:
    paths:
      - "src/lib/asaas-production-pilot*"
      - "src/App.tsx"
      - "docs/asaas-production/**"
      - ".github/workflows/asaas-pilot-route-validation.yml"
permissions:
  contents: read
jobs:
  pilot-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://onhmpgevkttysbfllhjq.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install without trusting stale optional-dependency lock metadata
        run: npm install --ignore-scripts --no-audit --no-fund --no-save
      - name: Test production-only pilot routing and hosted checkout links
        run: npx vitest run src/lib/asaas-production-pilot.test.ts src/lib/asaas-production-guard.test.ts --maxWorkers=2
      - name: Type-check and build
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npm run build
      - name: Ensure no new production SQL migration was introduced
        run: |
          if git diff --name-only origin/main...HEAD | grep '^supabase/migrations/'; then
            echo "Unexpected live migration"; exit 1
          fi
